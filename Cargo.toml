[package]
name = "binspect"
version = "0.1.0"
edition = "2021"
description = "Inspect ELF and PE executables: headers, sections, symbols, imports, exports and relocations."
license = "MIT"

[lib]
name = "binspect"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
